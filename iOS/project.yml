name: Cropnotes
options:
  bundleIdPrefix: com.shimondeitel.cropnotes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Cropnotes:
    type: application
    platform: iOS
    sources:
      - path: Cropnotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.cropnotes
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Cropnotes/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  CropnotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CropnotesTests
      - path: Cropnotes.storekit
    dependencies:
      - target: Cropnotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.cropnotes.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  CropnotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CropnotesUITests
    dependencies:
      - target: Cropnotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.cropnotes.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Cropnotes:
    build:
      targets:
        Cropnotes: all
        CropnotesTests: [test]
        CropnotesUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Cropnotes.storekit
    test:
      config: Debug
      storeKitConfiguration: Cropnotes.storekit
      targets:
        - CropnotesTests
        - CropnotesUITests
    archive:
      config: Release
